[project]
name = "automated_grounded_theory"
version = "0.9.5"
description = "Automated initial open coding, a theme report, and optional focused, axial, selective, and within-corpus sampling stages, with any LangChain chat model."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0,<2",
    "langchain-core>=0.3",
    "langgraph>=1.0,<2",
    "pydantic>=2",
]

[project.optional-dependencies]
xai = ["langchain-xai"]
openai = ["langchain-openai"]
anthropic = ["langchain-anthropic"]
google = ["langchain-google-genai"]
mistral = ["langchain-mistralai"]
groq = ["langchain-groq"]
ollama = ["langchain-ollama"]
azure = ["langchain-openai"]
aws = ["langchain-aws"]
cohere = ["langchain-cohere"]
huggingface = ["langchain-huggingface"]
checkpoint = ["langgraph-checkpoint-sqlite"]
plots = ["matplotlib"]
viz = ["grandalf"]
taguette = ["taguette>=1.5"]
dev = [
    "pytest",
    "langgraph-checkpoint-sqlite",
    "matplotlib",
    "nbclient",
    "ipykernel",
    "nbmake",
]

[project.scripts]
agt-evaluate = "automated_grounded_theory.evaluate:main"
agt-focused = "automated_grounded_theory.focused:main"

[project.urls]
Homepage = "https://github.com/davidscassell/automated-grounded-theory"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["automated_grounded_theory*"]

[tool.setuptools.package-data]
automated_grounded_theory = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
